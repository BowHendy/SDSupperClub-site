<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Forms</title></head>
  <body>
    <!--
      Static form skeleton for Netlify build-time detection.
      The React InviteForm submits via AJAX (fetch POST to /).
      Field names must match exactly what InviteForm.tsx sends.
      Spam protection: Netlify honeypot (bot-field). reCAPTCHA is intentionally
      omitted — the form is JS-rendered so Netlify cannot inject the widget.
    -->
    <form
      name="invite-request"
      method="POST"
      action="/__forms.html"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="invite-request" />
      <input name="bot-field" />
      <input type="text"  name="name" />
      <input type="email" name="email" />
      <input type="text"  name="referredBy" />
      <textarea           name="why"></textarea>
    </form>
  </body>
</html>
